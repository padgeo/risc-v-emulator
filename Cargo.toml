[workspace]
resolver = "3"
members = ["crates/*"]
# guests/ holds bare-metal RV32 programs for riscv32i-unknown-none-elf; it is a workspace of its own.
exclude = ["guests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
ratatui = "0.30"
rv-core = { path = "crates/rv-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# An emulator reinterprets and resizes integers constantly; these casts are deliberate.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
