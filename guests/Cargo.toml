[package]
name = "guests"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone workspace root: these crates target bare-metal RV32 (see .cargo/config.toml),
# not the host, so they must not be members of the main workspace.
[workspace]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
# Line tables let a future source-level view map instructions back to source lines.
debug = "line-tables-only"
